[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rtl-detective"
version = "0.1.0"
description = "Evidence-first verification and bounded repair for canonical SystemVerilog blocks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi==0.143.1",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "vcdvcd==2.6.0",
]

[project.optional-dependencies]
test = ["httpx2==2.13.1", "pytest==9.0.3"]

[project.scripts]
rtl-detective = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp"

